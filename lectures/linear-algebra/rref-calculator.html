<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light only">
<title>기약행사다리꼴 계산기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&display=swap">
<style>
:root{
  --ground:#F3F6F8; --surface:#FFFFFF; --sunk:#EAF0F3; --line:#D5DEE3;
  --ink:#14212A; --muted:#5A6B75; --accent:#005F86; --accent-soft:#DCEBF2;
  --pivot:#C8102E; --pivot-soft:#FBE7EA;
  --ok:#1E7A4C; --ok-soft:#E1F2E8; --warn:#9A5B00; --warn-soft:#FBEFD9;
  --bad:#B42318; --bad-soft:#FCE6E3;
  --shadow:0 1px 2px rgba(20,33,42,.06),0 8px 24px rgba(20,33,42,.06);
}
:root{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  font-size:15px;line-height:1.55}
.math{font-family:"STIX Two Text","Cambria Math","Times New Roman",serif}
.wrap{max-width:1180px;margin:0 auto;padding:36px 24px 56px;display:grid;gap:28px}
/* 로고 원본이 흰 바탕이라 두 테마 모두 흰 판 위에 올린다 */
.brand{display:flex;flex-wrap:wrap;align-items:center;gap:14px 22px;background:#FFFFFF;
  border:1px solid var(--line);border-radius:12px;padding:12px 20px;box-shadow:var(--shadow)}
.brand .logo{display:block;width:auto}
.brand .ssu{height:34px}
.brand .hyperx{height:24px}
.brand .rule{width:1px;align-self:stretch;background:#D5DEE3}
.brand .dept{margin-left:auto;font-size:12px;letter-spacing:.06em;color:#5A6B75}
@media (max-width:560px){.brand .rule,.brand .dept{display:none}}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600}
h1{margin:4px 0 0;font-size:30px;line-height:1.2;font-weight:700;text-wrap:balance}
h1 .en{font-family:"STIX Two Text",serif;font-style:italic;font-weight:400;color:var(--muted);font-size:22px;margin-left:10px}
.presets{display:flex;flex-wrap:wrap;gap:8px}
.chipbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);
  padding:7px 12px;border-radius:999px;font:inherit;font-size:13px;cursor:pointer}
.chipbtn:hover{border-color:var(--accent);color:var(--accent)}
.chipbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:24px;align-items:start}
@media (max-width:920px){.grid{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
  padding:22px;display:grid;gap:18px;min-width:0}
.panel h2{margin:0;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.controls{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:center}
.stepper{display:flex;align-items:center;gap:10px}
.stepper .lbl{font-size:13px;color:var(--muted)}
.stepper .box{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--sunk)}
.stepper button{width:34px;height:34px;border:0;background:transparent;color:var(--ink);font-size:18px;cursor:pointer}
.stepper button:hover{background:var(--accent-soft);color:var(--accent)}
.stepper output{min-width:32px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.toggle{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
.toggle input{appearance:none;width:38px;height:22px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;margin:0;transition:background .15s}
.toggle input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:transform .15s}
.toggle input:checked{background:var(--accent)}
.toggle input:checked::after{transform:translateX(16px)}
.scroll{overflow-x:auto;padding:4px 2px 8px}
.bracket{position:relative;display:inline-block;padding:10px 16px}
.bracket::before,.bracket::after{content:"";position:absolute;top:0;bottom:0;width:9px;border:2px solid var(--ink)}
.bracket::before{left:0;border-right:0;border-radius:4px 0 0 4px}
.bracket::after{right:0;border-left:0;border-radius:0 4px 4px 0}
.mat{display:grid;gap:6px 4px}
.cell-in{width:62px;height:40px;border:1px solid transparent;border-radius:8px;background:var(--sunk);color:var(--ink);
  text-align:center;font-family:"STIX Two Text",serif;font-size:18px;font-variant-numeric:tabular-nums}
.cell-in:hover{border-color:var(--line)}
.cell-in:focus{outline:none;border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-soft)}
.cell-in.err{border-color:var(--bad);background:var(--bad-soft)}
.aug{border-left:2px solid var(--muted)!important;margin-left:6px;padding-left:8px}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.hint kbd{font-family:inherit;font-size:11.5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--sunk)}
.out{min-width:64px;height:48px;display:flex;align-items:center;justify-content:center;padding:0 8px;
  font-size:22px;font-variant-numeric:tabular-nums;border-radius:6px;border:2px solid transparent}
.out.zero{color:var(--muted)}
.out.pv{border-color:var(--pivot);color:var(--pivot);background:var(--pivot-soft)}
.out.badrow{background:var(--bad-soft)}
.out.aug{border-radius:0 6px 6px 0}
.frac{display:inline-flex;flex-direction:column;align-items:center;line-height:1;font-size:.78em;vertical-align:middle}
.frac .num{padding:0 2px 2px;border-bottom:1px solid currentColor}
.frac .den{padding:2px 2px 0}
.sign{margin-right:2px}
.colhead{font-size:13px;color:var(--muted);text-align:center;font-style:italic;padding-bottom:2px}
.colhead.free{color:var(--warn);font-weight:600}
.colhead.aug{border-left-color:transparent!important}
.verdict{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;font-weight:600;font-size:14px}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.why{color:var(--muted);font-size:13.5px}
.stats{margin:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stat{background:var(--surface);padding:10px 14px}
.stat dt{font-size:12px;color:var(--muted)}
.stat dd{margin:2px 0 0;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.stat dd.small{font-size:16px;font-weight:400;font-family:"STIX Two Text",serif}
.sol{background:var(--sunk);border-radius:10px;padding:16px 18px;display:grid;gap:8px}
.sol .row{display:flex;align-items:center;gap:8px;font-size:21px;flex-wrap:wrap}
.sol .note{font-size:13px;color:var(--muted);font-family:"IBM Plex Sans KR",sans-serif}
.var{font-style:italic}
.var sub{font-style:normal;font-size:.62em}
.var.free{color:var(--warn)}
.errbox{color:var(--bad);font-size:14px;margin:0}
.stack{display:grid;gap:18px}
button:focus-visible,.chipbtn:focus-visible,.toggle input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

/* ---------- DOM helper (no HTML strings) ---------- */
function h(tag,attrs,...kids){
  const el=document.createElement(tag);
  if(attrs)for(const [k,v] of Object.entries(attrs)){
    if(v==null||v===false)continue;
    if(k==="class")el.className=v;
    else if(k==="style")el.style.cssText=v;
    else el.setAttribute(k,v);
  }
  for(const k of kids.flat()){
    if(k==null||k===false)continue;
    el.append(k instanceof Node?k:document.createTextNode(String(k)));
  }
  return el;
}

/* ---------- exact rationals ---------- */
const abs=a=>a<0n?-a:a;
const gcd=(a,b)=>{a=abs(a);b=abs(b);while(b){[a,b]=[b,a%b]}return a};
class Q{
  constructor(n,d=1n){if(d<0n){n=-n;d=-d}const g=gcd(n,d)||1n;this.n=n/g;this.d=d/g}
  get zero(){return this.n===0n}
  get one(){return this.n===1n&&this.d===1n}
  sub(o){return new Q(this.n*o.d-o.n*this.d,this.d*o.d)}
  mul(o){return new Q(this.n*o.n,this.d*o.d)}
  div(o){return new Q(this.n*o.d,this.d*o.n)}
  neg(){return new Q(-this.n,this.d)}
}
const ZERO=new Q(0n);
function parse(s){
  s=s.trim().replace(/[−–]/g,"-").replace(/^\+/,"");
  if(s===""||s==="-")return ZERO;
  let m;
  if(/^-?\d+$/.test(s))return new Q(BigInt(s));
  if((m=s.match(/^(-?\d+)\s*\/\s*(-?\d+)$/))){const d=BigInt(m[2]);return d===0n?null:new Q(BigInt(m[1]),d)}
  if((m=s.match(/^(-?)(\d*)\.(\d+)$/))){const n=BigInt((m[2]||"0")+m[3]);return new Q(m[1]?-n:n,10n**BigInt(m[3].length))}
  return null;
}

/* ---------- state ---------- */
const MAXR=8,MAXC=8;
let R=3,C=4,aug=true,vals=[];
const presets={
  unique:{r:3,c:3,aug:true,m:[["0","-7","-4","2"],["2","4","6","12"],["3","1","-1","-2"]]},
  inf:{r:3,c:4,aug:true,m:[["1","2","2","3","0"],["2","4","1","3","0"],["3","6","1","4","0"]]},
  none:{r:3,c:2,aug:true,m:[["1","1","2"],["3","4","5"],["4","5","9"]]},
};
const W=()=>C+(aug?1:0);
function ensure(){
  const nv=[];
  for(let i=0;i<R;i++){nv.push([]);for(let j=0;j<W();j++)nv[i].push(vals[i]?.[j]??"")}
  vals=nv;
}
function loadPreset(k){
  const p=presets[k];
  if(p){R=p.r;C=p.c;aug=p.aug;vals=p.m.map(r=>r.slice())}
  else vals=vals.map(r=>r.map(()=>""));
  render();
}

/* ---------- input grid ---------- */
const inMat=document.getElementById("inMat");
function buildInput(){
  ensure();
  inMat.style.gridTemplateColumns=`repeat(${W()},auto)`;
  const cells=[];
  for(let i=0;i<R;i++)for(let j=0;j<W();j++){
    const inp=h("input",{class:"cell-in"+(aug&&j===C?" aug":""),inputmode:"decimal",autocomplete:"off",
      "aria-label":`${i+1}행 ${j+1}열`,"data-i":i,"data-j":j});
    inp.value=vals[i][j];
    cells.push(inp);
  }
  inMat.replaceChildren(...cells);
  document.getElementById("rOut").textContent=R;
  document.getElementById("cOut").textContent=C;
  document.getElementById("augT").checked=aug;
}
inMat.addEventListener("input",e=>{
  const t=e.target;if(t.dataset.i==null)return;
  vals[+t.dataset.i][+t.dataset.j]=t.value;
  markPresets(null);compute();
});
inMat.addEventListener("keydown",e=>{
  const t=e.target;if(t.dataset.i==null)return;
  let i=+t.dataset.i;const j=+t.dataset.j;
  if(e.key==="ArrowDown"||e.key==="Enter")i=Math.min(R-1,i+1);
  else if(e.key==="ArrowUp")i=Math.max(0,i-1);
  else return;
  e.preventDefault();
  const next=inMat.children[i*W()+j];next.focus();next.select();
});
document.querySelectorAll("[data-dim]").forEach(b=>b.addEventListener("click",()=>{
  const d=+b.dataset.d;
  if(b.dataset.dim==="r")R=Math.min(MAXR,Math.max(1,R+d));
  else{
    const nc=Math.min(MAXC,Math.max(1,C+d));
    if(aug&&nc!==C){ // 우변 열을 새 마지막 자리로 옮긴다
      vals=vals.map(r=>{const b=r[C]??"";const left=r.slice(0,C);
        while(left.length<nc)left.push("");return left.slice(0,nc).concat([b])});
    }
    C=nc;
  }
  markPresets(null);render();
}));
document.getElementById("augT").addEventListener("change",e=>{
  if(aug&&!e.target.checked)vals=vals.map(r=>r.slice(0,C));
  aug=e.target.checked;markPresets(null);render();
});
function markPresets(k){document.querySelectorAll("[data-preset]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.preset===k?"true":"false"))}
document.querySelectorAll("[data-preset]").forEach(b=>b.addEventListener("click",()=>{
  markPresets(b.dataset.preset==="clear"?null:b.dataset.preset);loadPreset(b.dataset.preset);
}));

/* ---------- rref ---------- */
function rref(M){
  const rows=M.length,cols=M[0].length,pivots=[];
  let lead=0;
  outer:for(let r=0;r<rows;r++){
    if(lead>=cols)break;
    let i=r;
    while(M[i][lead].zero){i++;if(i===rows){i=r;lead++;if(lead===cols)break outer}}
    [M[i],M[r]]=[M[r],M[i]];
    const p=M[r][lead];
    M[r]=M[r].map(x=>x.div(p));
    for(let k=0;k<rows;k++){
      if(k===r||M[k][lead].zero)continue;
      const f=M[k][lead];
      M[k]=M[k].map((x,c)=>x.sub(f.mul(M[r][c])));
    }
    pivots.push([r,lead]);lead++;
  }
  return pivots;
}

/* ---------- formatting (nodes) ---------- */
const MINUS="−";
function fracNode(q,unsigned=false){
  const neg=q.n<0n,n=abs(q.n);
  const parts=[];
  if(neg&&!unsigned)parts.push(h("span",{class:"sign"},MINUS));
  if(q.d===1n)parts.push(n.toString());
  else parts.push(h("span",{class:"frac"},h("span",{class:"num"},n.toString()),h("span",{class:"den"},q.d.toString())));
  return h("span",null,...parts);
}
const varNode=(j,free)=>h("span",{class:"var"+(free?" free":"")},"x",h("sub",null,String(j+1)));
function linearNode(c,terms){
  const out=[];let first=true;
  if(!c.zero){out.push(fracNode(c));first=false}
  for(const [k,j] of terms){
    if(k.zero)continue;
    const neg=k.n<0n,mag=new Q(abs(k.n),k.d);
    if(!first)out.push(` ${neg?MINUS:"+"} `);else if(neg)out.push(MINUS);
    if(!mag.one){out.push(fracNode(mag));out.push(" ")}
    out.push(varNode(j,true));first=false;
  }
  if(first)out.push("0");
  return h("span",null,...out);
}

/* ---------- compute ---------- */
const result=document.getElementById("result");
function compute(){
  let bad=false;
  const M=vals.map((row,i)=>row.map((s,j)=>{
    const q=parse(s);const el=inMat.children[i*W()+j];
    if(el)el.classList.toggle("err",q===null);
    if(q===null)bad=true;return q;
  }));
  if(bad){
    result.replaceChildren(h("p",{class:"errbox"},"빨간 칸의 값을 읽을 수 없습니다. 정수, 소수, 또는 a/b 형태의 분수로 입력하세요."));
    return;
  }

  const pivots=rref(M);
  const pivotSet=new Set(pivots.map(([r,c])=>r+","+c));
  const pivotCols=new Set(pivots.map(p=>p[1]));
  const leftPivots=pivots.filter(p=>p[1]<C);
  const inconsistent=aug&&pivotCols.has(C);
  const badRow=inconsistent?pivots.find(p=>p[1]===C)[0]:-1;
  const freeCols=[];for(let j=0;j<C;j++)if(!pivotCols.has(j))freeCols.push(j);
  const rank=leftPivots.length;

  // 결과 행렬
  const grid=[];
  for(let j=0;j<W();j++){
    const isAug=aug&&j===C;
    grid.push(h("div",{class:"colhead math"+(!isAug&&freeCols.includes(j)?" free":"")+(isAug?" aug":"")},
      isAug?"b":["x",h("sub",null,String(j+1))]));
  }
  for(let i=0;i<R;i++)for(let j=0;j<W();j++){
    const q=M[i][j];
    const cls=["out","math"];
    if(pivotSet.has(i+","+j))cls.push("pv");else if(q.zero)cls.push("zero");
    if(i===badRow)cls.push("badrow");
    if(aug&&j===C)cls.push("aug");
    grid.push(h("div",{class:cls.join(" ")},fracNode(q)));
  }
  const matrix=h("div",{class:"scroll"},h("div",{class:"bracket"},
    h("div",{class:"mat",style:`grid-template-columns:repeat(${W()},auto)`},grid)));

  // 판정
  let pill,why,sol=null;
  if(!aug){
    pill=h("span",{class:"pill info"},`계수행렬 · rank ${rank}`);
    why=`pivot 열 ${rank}개, pivot이 없는 열 ${C-rank}개입니다.`;
  }else if(inconsistent){
    pill=h("span",{class:"pill bad"},"해가 없음 · inconsistent");
    why=`마지막 열에 pivot이 있어 ${badRow+1}행이 0 = 1이 됩니다.`;
  }else if(freeCols.length===0){
    pill=h("span",{class:"pill ok"},"해가 하나 · unique");
    why=`마지막 열에 pivot이 없고, 미지수 ${C}개의 열이 모두 pivot 열입니다.`;
    sol=h("div",{class:"sol"},pivots.map(([r,c])=>h("div",{class:"row math"},varNode(c)," = ",fracNode(M[r][C]))));
  }else{
    pill=h("span",{class:"pill warn"},"해가 무수히 많음 · infinitely many");
    why=`마지막 열에 pivot이 없고, pivot이 없는 열이 ${freeCols.length}개 있어 자유변수가 생깁니다.`;
    const rows=leftPivots.map(([r,c])=>h("div",{class:"row math"},varNode(c)," = ",
      linearNode(M[r][C],freeCols.map(j=>[M[r][j].neg(),j]))));
    const names=[];freeCols.forEach((j,k)=>{if(k)names.push(", ");names.push(varNode(j,true))});
    rows.push(h("div",{class:"note"},"자유변수 ",...names," 에는 아무 실수나 넣을 수 있습니다 (parametric form)."));
    sol=h("div",{class:"sol"},rows);
  }
  const verdict=h("div",{class:"verdict"},pill,h("span",{class:"why"},why));

  const pc=leftPivots.length?leftPivots.map(p=>"x"+(p[1]+1)).join(", "):"없음";
  const stats=h("dl",{class:"stats"},
    h("div",{class:"stat"},h("dt",null,"rank (pivot 수)"),h("dd",null,String(rank))),
    h("div",{class:"stat"},h("dt",null,"자유변수 수"),h("dd",null,String(freeCols.length))),
    h("div",{class:"stat"},h("dt",null,"pivot 열"),h("dd",{class:"small"},pc)));

  result.replaceChildren(h("div",{class:"stack"},matrix,verdict,stats,sol));
}
function render(){buildInput();compute()}
loadPreset("inf");
})();
</script>
