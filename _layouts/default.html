<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != "Home" %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}?v=3" type="image/svg+xml">
  <link rel="icon" href="{{ '/assets/img/favicon-32.png' | relative_url }}?v=3" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}?v=3">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body class="page-{{ page.slug | default: 'default' }}">
  {% include header.html %}
  <main>
    {% if page.hero != false and page.slug != "home" %}
    <section class="page-hero">
      <canvas class="starfield" aria-hidden="true"></canvas>
      <div class="container">
        <p class="eyebrow">{{ page.eyebrow | default: "HyperX Lab" }}</p>
        <h1>{{ page.title }}</h1>
        {% if page.lead %}<p class="lead">{{ page.lead }}</p>{% endif %}
      </div>
    </section>
    {% endif %}
    {{ content }}
  </main>
  {% include footer.html %}
  <script src="{{ '/assets/js/main.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
</body>
</html>
