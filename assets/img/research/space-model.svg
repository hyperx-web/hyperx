<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" font-family="Inter, Arial, sans-serif">
  <defs>
    <radialGradient id="sky" cx="50%" cy="10%" r="95%">
      <stop offset="0" stop-color="#151c44"/><stop offset="1" stop-color="#05070f"/>
    </radialGradient>
    <radialGradient id="earth" cx="50%" cy="0%" r="70%">
      <stop offset="0" stop-color="#3a7bd5"/><stop offset=".55" stop-color="#1b3f8a"/><stop offset="1" stop-color="#0b1a3f"/>
    </radialGradient>
    <linearGradient id="foot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4cc9f0" stop-opacity=".45"/><stop offset="1" stop-color="#4cc9f0" stop-opacity=".04"/>
    </linearGradient>
    <linearGradient id="footHop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7b61ff" stop-opacity=".55"/><stop offset="1" stop-color="#7b61ff" stop-opacity=".05"/>
    </linearGradient>
    <g id="sat">
      <rect x="-30" y="-8" width="20" height="16" fill="#2b4a9b" stroke="#9fb6ff" stroke-width="1.5"/>
      <rect x="10" y="-8" width="20" height="16" fill="#2b4a9b" stroke="#9fb6ff" stroke-width="1.5"/>
      <rect x="-9" y="-11" width="18" height="22" rx="3" fill="#dfe6ff"/>
      <path d="M-30 0H-10M10 0H30" stroke="#9fb6ff" stroke-width="1"/>
    </g>
  </defs>
  <rect width="800" height="800" rx="36" fill="url(#sky)"/>
  <g fill="#fff">
    <circle cx="80" cy="70" r="1.6" opacity=".7"/><circle cx="210" cy="40" r="1.2" opacity=".5"/><circle cx="350" cy="95" r="1.4" opacity=".6"/>
    <circle cx="520" cy="50" r="1.2" opacity=".5"/><circle cx="700" cy="110" r="1.6" opacity=".7"/><circle cx="760" cy="300" r="1.2" opacity=".5"/>
    <circle cx="40" cy="330" r="1.3" opacity=".5"/><circle cx="610" cy="180" r="1" opacity=".5"/>
  </g>

  <!-- Earth -->
  <ellipse cx="400" cy="1180" rx="760" ry="560" fill="url(#earth)"/>
  <ellipse cx="400" cy="1180" rx="760" ry="560" fill="none" stroke="#7fd3ff" stroke-opacity=".5" stroke-width="5"/>

  <!-- orbits -->
  <ellipse cx="400" cy="1180" rx="830" ry="760" fill="none" stroke="#4cc9f0" stroke-opacity=".35" stroke-width="1.5" stroke-dasharray="5 7"/>
  <ellipse cx="400" cy="1180" rx="900" ry="1060" fill="none" stroke="#ffc93c" stroke-opacity=".3" stroke-width="1.5" stroke-dasharray="5 7"/>

  <!-- GEO satellite -->
  <g transform="translate(400 128) scale(1.25)"><use href="#sat"/></g>
  <text x="470" y="128" fill="#ffc93c" font-size="17" font-weight="700">GEO</text>
  <path d="M400 150 L250 455 M400 150 L560 455" stroke="#ffc93c" stroke-opacity=".35" stroke-width="1.5" stroke-dasharray="4 6"/>

  <!-- LEO cluster -->
  <g transform="translate(170 450) rotate(-14)"><use href="#sat"/></g>
  <g transform="translate(330 422) rotate(-4)"><use href="#sat"/></g>
  <g transform="translate(480 422) rotate(4)"><use href="#sat"/></g>
  <g transform="translate(635 452) rotate(14)"><use href="#sat"/></g>

  <!-- optical ISL -->
  <g stroke="#f72585" stroke-width="3" stroke-dasharray="10 8">
    <path d="M200 443 L300 424"><animate attributeName="stroke-dashoffset" values="36;0" dur="1s" repeatCount="indefinite"/></path>
    <path d="M360 421 L450 421"><animate attributeName="stroke-dashoffset" values="36;0" dur="1s" repeatCount="indefinite"/></path>
    <path d="M510 424 L605 443"><animate attributeName="stroke-dashoffset" values="36;0" dur="1s" repeatCount="indefinite"/></path>
  </g>

  <!-- beam footprints (beam hopping) -->
  <path d="M330 440 L268 640 L392 640 Z" fill="url(#footHop)">
    <animate attributeName="opacity" values="1;.25;1" dur="2.4s" repeatCount="indefinite"/>
  </path>
  <path d="M480 440 L418 640 L542 640 Z" fill="url(#foot)">
    <animate attributeName="opacity" values=".25;1;.25" dur="2.4s" repeatCount="indefinite"/>
  </path>
  <ellipse cx="330" cy="640" rx="62" ry="13" fill="none" stroke="#a897ff" stroke-width="2"/>
  <ellipse cx="480" cy="640" rx="62" ry="13" fill="none" stroke="#4cc9f0" stroke-width="2"/>

  <!-- ground terminals -->
  <g fill="#dfe6ff">
    <circle cx="315" cy="645" r="5"/><circle cx="345" cy="638" r="5"/>
    <circle cx="470" cy="643" r="5"/><circle cx="498" cy="637" r="5"/>
  </g>
  <g transform="translate(640 690)">
    <path d="M-24 0 A24 24 0 0 1 24 0 Z" fill="#dfe6ff"/><path d="M0 0 V22 M-14 22 H14" stroke="#dfe6ff" stroke-width="3"/>
  </g>
  <path d="M635 470 L640 668" stroke="#dfe6ff" stroke-opacity=".5" stroke-width="2" stroke-dasharray="4 5"/>

  <!-- eavesdropper -->
  <g transform="translate(110 300) rotate(-20)"><use href="#sat"/></g>
  <circle cx="110" cy="300" r="40" fill="none" stroke="#ff4d6d" stroke-width="2" stroke-dasharray="4 5"/>
  <path d="M135 330 L300 620" stroke="#ff4d6d" stroke-opacity=".55" stroke-width="2" stroke-dasharray="3 6"/>

  <!-- labels -->
  <g font-size="17" font-weight="700">
    <rect x="300" y="350" width="200" height="34" rx="17" fill="#f72585" fill-opacity=".14" stroke="#f72585" stroke-opacity=".55"/>
    <text x="400" y="373" fill="#ff6fae" text-anchor="middle">Optical ISL · cluster</text>
    <rect x="40" y="225" width="150" height="34" rx="17" fill="#ff4d6d" fill-opacity=".14" stroke="#ff4d6d" stroke-opacity=".55"/>
    <text x="115" y="248" fill="#ff8fa3" text-anchor="middle">Eavesdropper</text>
    <rect x="300" y="690" width="200" height="34" rx="17" fill="#7b61ff" fill-opacity=".18" stroke="#7b61ff" stroke-opacity=".6"/>
    <text x="400" y="713" fill="#c4b8ff" text-anchor="middle">Beam hopping cells</text>
    <rect x="590" y="740" width="150" height="34" rx="17" fill="#dfe6ff" fill-opacity=".1" stroke="#dfe6ff" stroke-opacity=".4"/>
    <text x="665" y="763" fill="#dfe6ff" text-anchor="middle">NTN gateway</text>
    <text x="680" y="505" fill="#4cc9f0" text-anchor="middle">LEO</text>
  </g>
</svg>
