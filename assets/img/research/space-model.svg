<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="'Times New Roman', Times, serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222"/></marker>
    <g id="sat">
      <rect x="-22" y="-6" width="14" height="12" fill="#fff" stroke="#222" stroke-width="1.4"/>
      <rect x="8" y="-6" width="14" height="12" fill="#fff" stroke="#222" stroke-width="1.4"/>
      <path d="M-8 0H-4M4 0H8" stroke="#222" stroke-width="1.4"/>
      <rect x="-5" y="-8" width="10" height="16" fill="#222"/>
    </g>
  </defs>
  <rect width="800" height="600" fill="#ffffff"/>

  <!-- Earth (center O at 400,1060; R_E=520) -->
  <path d="M-10 640 A890 890 0 0 1 810 640" fill="#eef3fa" stroke="#222" stroke-width="2"/>
  <!-- LEO orbit shell R_E + h -->
  <path d="M-10 377 A1130 1130 0 0 1 810 377" fill="none" stroke="#2f5d9e" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="18" y="410" font-size="17" fill="#2f5d9e">LEO shell (<tspan font-style="italic">R</tspan><tspan font-size="11" baseline-shift="sub">E</tspan> + <tspan font-style="italic">h</tspan>)</text>
  <!-- GEO arc -->
  <path d="M60 60 Q400 -20 740 60" fill="none" stroke="#888" stroke-width="1.2" stroke-dasharray="3 5"/>
  <use href="#sat" x="400" y="38"/>
  <text x="430" y="44" font-size="17" fill="#555">GEO</text>
  <path d="M400 50 L400 105" stroke="#888" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- typical user at top of earth -->
  <g transform="translate(400 540)">
    <path d="M-10 0 L0 -18 L10 0 Z" fill="#222"/>
  </g>
  <text x="372" y="572" font-size="18">Typical user</text>
  <!-- local horizon -->
  <line x1="200" y1="540" x2="600" y2="540" stroke="#222" stroke-width="1" stroke-dasharray="2 4"/>

  <!-- satellites on shell; cluster in center -->
  <use href="#sat" x="330" y="303"/><use href="#sat" x="400" y="300"/><use href="#sat" x="470" y="303"/>
  <use href="#sat" x="160" y="326"/><use href="#sat" x="650" y="328"/>
  <!-- cluster ellipse -->
  <ellipse cx="400" cy="302" rx="105" ry="30" fill="none" stroke="#c0622b" stroke-width="1.5"/>
  <text x="400" y="262" font-size="18" fill="#c0622b" text-anchor="middle">Satellite cluster (cooperative Tx)</text>
  <!-- ISL -->
  <path d="M352 303 L378 300 M422 300 L448 303" stroke="#c0622b" stroke-width="2"/>

  <!-- serving links -->
  <path d="M400 312 L400 520" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M332 314 L392 520" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M468 314 L408 520" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="408" y="420" font-size="19" font-style="italic">d</text><text x="419" y="425" font-size="13" font-style="italic">n</text>

  <!-- interfering links -->
  <path d="M172 335 L388 528" stroke="#9a9a9a" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <path d="M638 337 L412 528" stroke="#9a9a9a" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="560" y="455" font-size="17" fill="#555">interference</text>

  <!-- elevation angle -->
  <path d="M470 540 A70 70 0 0 0 450 492" fill="none" stroke="#222" stroke-width="1.2"/>
  <text x="474" y="514" font-size="19" font-style="italic">φ</text>

  <!-- altitude h and visibility cap -->
  <path d="M720 346 L720 598" stroke="#222" stroke-width="1" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="730" y="480" font-size="20" font-style="italic">h</text>
  <path d="M232 318 Q400 284 568 318" fill="none" stroke="#2f5d9e" stroke-width="3" stroke-opacity=".25"/>

  <!-- Legend -->
  <g font-size="16">
    <rect x="16" y="16" width="236" height="96" fill="#fff" stroke="#222" stroke-width="1"/>
    <line x1="28" y1="40" x2="68" y2="40" stroke="#222" stroke-width="1.6"/><text x="78" y="45">Desired signal</text>
    <line x1="28" y1="66" x2="68" y2="66" stroke="#9a9a9a" stroke-width="1.3" stroke-dasharray="6 4"/><text x="78" y="71">Interference</text>
    <line x1="28" y1="92" x2="68" y2="92" stroke="#c0622b" stroke-width="2"/><text x="78" y="97">Inter-satellite link</text>
  </g>
</svg>
