<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="'Times New Roman', Times, serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#222"/></marker>
    <g id="sat">
      <rect x="-18" y="-5" width="11" height="10" fill="#fff" stroke="#222" stroke-width="1.3"/>
      <rect x="7" y="-5" width="11" height="10" fill="#fff" stroke="#222" stroke-width="1.3"/>
      <rect x="-5" y="-7" width="10" height="14" fill="#222"/>
    </g>
  </defs>
  <rect width="800" height="600" fill="#ffffff"/>

  <!-- Environment -->
  <rect x="40" y="30" width="720" height="210" fill="#f4f7fc" stroke="#222" stroke-width="1.5"/>
  <text x="56" y="58" font-size="19" font-weight="bold">Environment: multi-satellite LEO system</text>
  <use href="#sat" x="250" y="100"/><use href="#sat" x="400" y="92"/><use href="#sat" x="550" y="100"/>
  <!-- beams to cells -->
  <g fill="#dbe7f7" stroke="#2f5d9e" stroke-width="1.2">
    <path d="M250 108 L205 205 L295 205 Z"/>
    <path d="M550 108 L505 205 L595 205 Z"/>
  </g>
  <path d="M400 100 L355 205 L445 205 Z" fill="none" stroke="#9a9a9a" stroke-width="1.2" stroke-dasharray="4 4"/>
  <!-- hexagonal cells -->
  <g fill="none" stroke="#222" stroke-width="1">
    <ellipse cx="250" cy="208" rx="45" ry="10"/><ellipse cx="400" cy="208" rx="45" ry="10"/><ellipse cx="550" cy="208" rx="45" ry="10"/>
    <ellipse cx="130" cy="208" rx="45" ry="10"/><ellipse cx="670" cy="208" rx="45" ry="10"/>
  </g>
  <text x="400" y="232" font-size="15" text-anchor="middle" fill="#555">illuminated / idle cells (beam hopping)</text>

  <!-- Agent -->
  <rect x="200" y="330" width="400" height="160" fill="#fff" stroke="#222" stroke-width="1.5"/>
  <text x="216" y="356" font-size="19" font-weight="bold">Agent (policy network <tspan font-style="italic" font-weight="normal">π</tspan><tspan font-size="13" baseline-shift="sub" font-style="italic" font-weight="normal">θ</tspan>)</text>
  <!-- small DNN -->
  <g stroke="#666" stroke-width=".8">
    <path d="M260 395L330 385M260 395L330 425M260 395L330 465M260 445L330 385M260 445L330 425M260 445L330 465M330 385L400 405M330 385L400 445M330 425L400 405M330 425L400 445M330 465L400 405M330 465L400 445"/>
  </g>
  <g fill="#fff" stroke="#222" stroke-width="1.4">
    <circle cx="260" cy="395" r="9"/><circle cx="260" cy="445" r="9"/>
    <circle cx="330" cy="385" r="9"/><circle cx="330" cy="425" r="9"/><circle cx="330" cy="465" r="9"/>
    <circle cx="400" cy="405" r="9"/><circle cx="400" cy="445" r="9"/>
  </g>
  <!-- LLM module -->
  <rect x="450" y="380" width="130" height="80" fill="#fbe3d3" stroke="#c0622b" stroke-width="1.3"/>
  <text x="515" y="412" font-size="17" text-anchor="middle">LLM-assisted</text>
  <text x="515" y="436" font-size="17" text-anchor="middle">search steering</text>
  <path d="M450 420 L412 420" stroke="#c0622b" stroke-width="1.3" marker-end="url(#a)"/>

  <!-- State / reward / action arrows -->
  <path d="M110 240 V410 H198" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="16" y="300" font-size="19">State <tspan font-style="italic">s</tspan><tspan font-size="13" baseline-shift="sub" font-style="italic">t</tspan></text>
  <text x="16" y="322" font-size="13" fill="#555">(CSI,</text><text x="16" y="338" font-size="13" fill="#555">demand)</text>
  <path d="M150 240 V380 H198" fill="none" stroke="#222" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="160" y="290" font-size="19">Reward <tspan font-style="italic">r</tspan><tspan font-size="13" baseline-shift="sub" font-style="italic">t</tspan></text>
  <path d="M602 410 H690 V242" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="604" y="300" font-size="19">Action <tspan font-style="italic">a</tspan><tspan font-size="13" baseline-shift="sub" font-style="italic">t</tspan></text>

  <!-- action contents -->
  <g font-size="17">
    <rect x="80" y="520" width="200" height="50" fill="#fff" stroke="#222" stroke-width="1.2"/>
    <text x="180" y="551" text-anchor="middle">Beam hopping pattern</text>
    <rect x="300" y="520" width="200" height="50" fill="#fff" stroke="#222" stroke-width="1.2"/>
    <text x="400" y="551" text-anchor="middle">Cell association</text>
    <rect x="520" y="520" width="200" height="50" fill="#fff" stroke="#222" stroke-width="1.2"/>
    <text x="620" y="551" text-anchor="middle">Secure beamforming</text>
  </g>
  <path d="M400 490 V518" stroke="#222" stroke-width="1.2" marker-end="url(#a)"/>
  <path d="M330 490 L190 518" stroke="#222" stroke-width="1.2" marker-end="url(#a)"/>
  <path d="M470 490 L610 518" stroke="#222" stroke-width="1.2" marker-end="url(#a)"/>
</svg>
