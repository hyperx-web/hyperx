<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="'Times New Roman', Times, serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222"/></marker>
    <g id="ue">
      <rect x="-11" y="-19" width="22" height="38" rx="4" fill="#fff" stroke="#222" stroke-width="1.8"/>
      <rect x="-7" y="-13" width="14" height="22" fill="#dbe7f7" stroke="#222" stroke-width="1"/>
      <circle cy="14" r="1.8" fill="#222"/>
    </g>
  </defs>
  <rect width="800" height="600" fill="#ffffff"/>

  <!-- BS with ULA -->
  <path d="M95 520 L112 300 L128 300 L145 520 Z" fill="#fff" stroke="#222" stroke-width="1.8"/>
  <path d="M104 440H136M108 380H132" stroke="#222" stroke-width="1.2"/>
  <line x1="120" y1="120" x2="120" y2="300" stroke="#222" stroke-width="1.8"/>
  <g fill="#fff" stroke="#222" stroke-width="1.6">
    <rect x="112" y="130" width="16" height="16"/><rect x="112" y="165" width="16" height="16"/>
    <rect x="112" y="200" width="16" height="16"/><rect x="112" y="260" width="16" height="16"/>
  </g>
  <text x="120" y="244" font-size="20" text-anchor="middle">⋮</text>
  <path d="M90 130 V276" stroke="#222" stroke-width="1" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="70" y="208" font-size="20" font-style="italic" text-anchor="middle">N</text>
  <text x="120" y="550" font-size="20" text-anchor="middle">BS (ULA)</text>

  <!-- RSMA message splitting box -->
  <rect x="20" y="20" width="250" height="70" fill="#f4f7fc" stroke="#222" stroke-width="1.2"/>
  <text x="32" y="46" font-size="17">RSMA: <tspan font-style="italic">W</tspan><tspan font-size="12" baseline-shift="sub" font-style="italic">k</tspan> → {<tspan font-style="italic">W</tspan><tspan font-size="12" baseline-shift="sub" font-style="italic">c,k</tspan>, <tspan font-style="italic">W</tspan><tspan font-size="12" baseline-shift="sub" font-style="italic">p,k</tspan>}</text>
  <text x="32" y="74" font-size="17"><tspan font-style="italic">x</tspan> = <tspan font-weight="bold">p</tspan><tspan font-size="12" baseline-shift="sub">c</tspan><tspan font-style="italic">s</tspan><tspan font-size="12" baseline-shift="sub">c</tspan> + Σ<tspan font-size="12" baseline-shift="sub"><tspan font-style="italic">k</tspan></tspan> <tspan font-weight="bold">p</tspan><tspan font-size="12" baseline-shift="sub" font-style="italic">k</tspan><tspan font-style="italic">s</tspan><tspan font-size="12" baseline-shift="sub" font-style="italic">k</tspan></text>

  <!-- beams to users (lobes) -->
  <g fill="#dbe7f7" fill-opacity=".7" stroke="#2f5d9e" stroke-width="1.4">
    <path d="M135 200 Q420 70 640 120 Q450 170 135 200 Z"/>
    <path d="M135 205 Q420 230 660 280 Q420 300 135 205 Z"/>
  </g>
  <g fill="#fbe3d3" fill-opacity=".8" stroke="#c0622b" stroke-width="1.4">
    <path d="M135 210 Q380 380 560 470 Q360 420 135 210 Z"/>
  </g>

  <!-- users -->
  <use href="#ue" x="665" y="120"/><use href="#ue" x="690" y="285"/><use href="#ue" x="585" y="480"/>
  <text x="700" y="112" font-size="19">UE 1</text>
  <text x="725" y="278" font-size="19">UE 2</text>
  <text x="615" y="475" font-size="19">UE <tspan font-style="italic">K</tspan></text>
  <text x="680" y="390" font-size="22" text-anchor="middle">⋮</text>
  <text x="420" y="104" font-size="20" font-style="italic" font-weight="bold">h</text><text x="432" y="110" font-size="13" font-style="italic">1</text>
  <text x="450" y="230" font-size="20" font-style="italic" font-weight="bold">h</text><text x="462" y="236" font-size="13" font-style="italic">2</text>
  <text x="380" y="352" font-size="20" font-style="italic" font-weight="bold">h</text><text x="392" y="358" font-size="13" font-style="italic">K</text>

  <!-- near-field spherical wavefront -->
  <g fill="none" stroke="#555" stroke-width="1" stroke-dasharray="4 4">
    <path d="M190 120 A90 90 0 0 1 190 290"/>
    <path d="M235 95 A130 130 0 0 1 235 315"/>
  </g>
  <text x="300" y="40" font-size="16" fill="#444">near-field: spherical wavefront (<tspan font-style="italic">r</tspan> &lt; <tspan font-style="italic">d</tspan><tspan font-size="11" baseline-shift="sub">R</tspan>)</text>
  <path d="M300 48 L240 98" stroke="#444" stroke-width="1"/>

  <!-- ISAC target -->
  <g transform="translate(470 520)">
    <path d="M-38 6 L-14 -8 L28 -8 L42 6 L28 14 L-30 14 Z" fill="#fff" stroke="#222" stroke-width="1.8"/>
    <path d="M-8 -8 L2 -26 L12 -8" fill="#fff" stroke="#222" stroke-width="1.6"/>
  </g>
  <text x="470" y="565" font-size="18" text-anchor="middle">Sensing target</text>
  <path d="M140 225 L425 505" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <path d="M415 500 L150 245" stroke="#9a9a9a" stroke-width="1.2" stroke-dasharray="2 4" marker-end="url(#a)"/>
  <text x="168" y="318" font-size="17" font-style="italic">echo</text>
  <!-- angle theta -->
  <line x1="128" y1="225" x2="330" y2="225" stroke="#222" stroke-width="1" stroke-dasharray="2 3"/>
  <path d="M200 225 A72 72 0 0 1 182 278" fill="none" stroke="#222" stroke-width="1.2"/>
  <text x="208" y="262" font-size="19" font-style="italic">θ</text>
  <text x="322" y="382" font-size="19" font-style="italic">r</text>
</svg>
