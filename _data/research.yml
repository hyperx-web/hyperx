# 연구 분야 — keywords: 논문 제목에 이 단어(소문자)가 있으면 관련 논문으로 자동 표시
- id: ai
  title: AI for Wireless Communications
  image: ai-model.svg
  images:   # 여러 그림 (있으면 image 대신 사용)
    # (hidden, kept) - { file: ai-concept-anim.svg, caption: "Beamspace transport + neural rebalancing warm start" }
    # (hidden, kept) - { file: ai-network-anim.svg, caption: "Permutation-equivariant rebalancing network" }
    - { file: ai-rlbf-anim.svg, caption: "Reinforcement learning-based beamformer designs" }
    - { file: ai-btnws-anim.svg, caption: "Neural warm start for sequential rate matching (BT-NWS-GPI)" }
    - { file: ai-agent-anim.svg, caption: "Solver agent for demand-surge adaptation (Act–Observe–Decide)" }
  summary: Applying various machine learning models for intelligent communication systems.
  topics:
    - Reinforcement learning-based secure beamforming
    - LLM-assisted optimization for beam hopping and cell association
    - Neural warm start and agentic demand adaptation for RSMA
  keywords: [learning, llm, neural, agentic, ai 기반]

- id: 6g
  title: 6G Technologies
  image: 6g-model.svg
  images:
    - { file: 6g-rsma-anim.svg, caption: "RSMA system for unicast and multicast" }
    - { file: 6g-afdm-anim.svg, caption: "AFDM transceiver with delay–Doppler sensing" }
  summary: Investigating ultra-low latency, high-speed communication protocols for next-gen connectivity.
  topics:
    - Rate-splitting multiple access (RSMA) for unicast and multicast
    - Integrated sensing and communication (ISAC) with AFDM
    - Near-field channel estimation for movable antenna systems
    - Beam squint and wideband beamforming
    - Distributed MIMO and phase-error-aware power allocation
    - Secure ambient IoT networks
  keywords: [iot, rate-splitting, rsma, isac, near-field, movable antenna, mimo, beamforming, beam squint, full-duplex, relay, 6g]
  exclude_keywords: [satellite, leo, geo, ntn, non-terrestrial, orbit, constellation, 위성]   # 위성 논문은 6G 목록에서 제외

- id: satellite
  title: Satellite & Space Communications
  image: space-model.svg
  animation: constellation   # 그림 대신 위성군 애니메이션 표시
  summary: Advancing satellite and space communication technologies for global connectivity.
  topics:
    - LEO mega-constellation modeling and coverage analysis
    - Satellite clustering for non-terrestrial networks
    - GEO and hybrid GEO-LEO satellite networks
    - Beam hopping and cell association in multi-satellite LEO systems
    - Optical inter-satellite links (FSO) and pointing errors
    - 3GPP NTN standardization and system-level simulation
    - Physical-layer security against satellite eavesdroppers
  keywords: [satellite, leo, geo, non-terrestrial, ntn, orbit, constellation]
